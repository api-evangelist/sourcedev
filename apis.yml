aid: sourcedev
name: Source.dev
description: >-
  Source.dev builds AI-native software tooling that helps device manufacturers
  develop, build, and update the operating systems that run intelligent devices
  such as smartphones and electric vehicles. Its platform virtualizes source
  access (SourceFS) to cut Android checkout-and-build times from hours to
  minutes, replays build steps across languages and systems for faster CI, and
  uses LLM-driven merging (Harmony AI / Continuous Merges) to automatically
  resolve conflicts when applying security patches and OS upgrades to large,
  long-lived codebases like AOSP. The company is a sales/demo-led platform for
  device makers and does not currently publish a public developer API, SDK, or
  self-serve documentation surface.
